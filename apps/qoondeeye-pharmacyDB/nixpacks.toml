[phases.setup]
nixPkgs = ["nodejs_22", "pnpm"]

[phases.install]
onlyIncludeFiles = [
  ".npmrc",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "apps/qoondeeye-pharmacyDB/package.json",
  "packages/validation/package.json",
  "packages/typescript-config/package.json",
]
cmds = [
  "pnpm install --frozen-lockfile --filter backend... --ignore-scripts"
]

[phases.build]
cmds = [
  "cd apps/qoondeeye-pharmacyDB && pnpm prisma generate",
  "cd apps/qoondeeye-pharmacyDB && pnpm prisma migrate deploy",
  "pnpm --filter backend run build"
]

[start]
cmd = "pnpm --filter backend run start:prod"

# Render Blueprint — qoondeeye-pharmacyDB (Nest API)
# https://render.com/docs/blueprint-spec
#
# Monorepo rule: do NOT set rootDir to apps/qoondeeye-pharmacyDB. The Docker build
# context must be the repository root (pnpm-lock.yaml, packages/, apps/).
services:
  - type: web
    name: qoondeeye-pharmacy-api
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    buildFilter:
      paths:
        - apps/qoondeeye-pharmacyDB/**
        - packages/validation/**
        - packages/typescript-config/**
        - Dockerfile
        - .dockerignore
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - .npmrc
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
